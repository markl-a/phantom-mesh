[package]
name = "phantom-mesh"
version = "0.5.0"
edition = "2021"
description = "Phantom Mesh — distributed AI agent daemon with 53 tools, 48 hands, 11 providers, cluster orchestration, and self-evolution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markl-a/phantom-mesh"
homepage = "https://github.com/markl-a/phantom-mesh"
keywords = ["agent", "llm", "distributed", "rust", "ai"]
categories = ["command-line-utilities", "web-programming"]
default-run = "phantom-mesh"

[[bin]]
name = "phantom-mesh"
path = "src/main.rs"

[lib]
name = "phantom_mesh"
path = "src/lib.rs"

[features]
default = []
pg = ["dep:tokio-postgres", "dep:pgvector"]
bedrock = ["dep:aws-sdk-bedrockruntime", "dep:aws-config"]

[dependencies]
# Crypto
sha2 = "0.10"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP server
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (for LLM API calls + Telegram Bot API)
reqwest = { version = "0.12", features = ["json", "stream"] }

# SQLite (bundled — no external sqlite3.dll needed on Windows)
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Base64 encoding (for screenshot data in Computer Use)
base64 = "0.22"

# Regex (for credential scrubbing)
regex = "1"
once_cell = "1"

# Utilities
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
urlencoding = "2"

# Streaming support
futures-util = "0.3"
tokio-stream = "0.1"

# WebSocket client (for ChatGPT backend-api realtime)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# URL parsing (for http_request tool domain allowlist)
url = "2"

# Home directory resolution (for Codex OAuth)
dirs = "5"

# Binary lookup (for credential scanner)
which = "7"

# System info (CPU load for cluster worker)
sysinfo = "0.32"

# mDNS service discovery (Layer 1 networking)
mdns-sd = "0.11"
flume = "0.11"

# CSV parsing (for csv_parse tool)
csv = "1"

# Encrypted secrets (Sprint 3)
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"

# KeyVault (B.4) — Argon2id KDF + AES-256-GCM per-key encryption
argon2 = "0.5"
aes-gcm = "0.10"

# Cluster Key Sync (B.4) — X25519 Diffie-Hellman key exchange
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Security hardening (B.4 review fixes)
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"
hkdf = "0.12"

# PostgreSQL + pgvector (optional — for semantic memory pgvector backend)
tokio-postgres = { version = "0.7", optional = true }
pgvector = { version = "0.4", features = ["postgres"], optional = true }

# AWS Bedrock (optional — behind `bedrock` feature flag)
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benchmarks"
harness = false

[[bench]]
name = "core_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# CI 用的 profile — 比 debug 快但比 release 快編譯
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 4
strip = false
