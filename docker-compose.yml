# ============================================================================
# Clawtex-Core Docker Compose — Route G (Managed Hosting)
#
# Usage:
#   1. Copy .env.example to .env and fill in your secrets
#   2. Place your agents.toml in ./config/agents.toml
#   3. Place hand definitions in ./config/hands/
#   4. Run: docker-compose up -d
#   5. View logs: docker-compose logs -f clawtex-core
# ============================================================================

services:
  clawtex-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clawtex-core
    restart: unless-stopped

    ports:
      # HTTP API + SSE/WebSocket gateway
      - "7878:7878"

    volumes:
      # Persist config, databases, workspace, hands, and skills
      # ./config/ on host maps to /root/.clawtex/ in container
      - ./config:/root/.clawtex

      # Alternatively, mount individual paths:
      # - ./config/agents.toml:/root/.clawtex/agents.toml:ro
      # - ./config/hands:/root/.clawtex/hands:ro
      # - clawtex-data:/root/.clawtex/workspace
      # - clawtex-db:/root/.clawtex

    environment:
      # ── Required ──
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}

      # ── LLM Provider API Keys ──
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # ── Search API Keys ──
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}

      # ── Email (SMTP) ──
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}

      # ── PostgreSQL (optional, for pgvector semantic memory) ──
      - CLAWTEX_PG_URL=${CLAWTEX_PG_URL:-}

      # ── Rust logging ──
      - RUST_LOG=${RUST_LOG:-info}

      # ── Home directory (used by clawtex-core to find ~/.clawtex) ──
      - HOME=/root

    # Resource limits (adjust based on your hosting plan)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # If you need Ollama running on the host, use host networking or
    # add an extra_hosts entry so the container can reach localhost services:
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Security: drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE  # needed for Playwright/Chromium

# Named volumes (uncomment if using split volume mounts above)
# volumes:
#   clawtex-data:
#   clawtex-db:
