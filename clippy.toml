# Phantom Mesh clippy 配置
# 放寬一些過於嚴格的 pedantic lint

# 允許函式最多 10 個參數（agent_runtime 一些函式較複雜）
too-many-arguments-threshold = 10

# 允許較大的 enum 變體
single-char-binding-names-threshold = 4

# 允許較長的函式（某些 tool 實作較長）
too-many-lines-threshold = 200

# cognitive complexity 門檻
cognitive-complexity-threshold = 30

# 允許的 type complexity
type-complexity-threshold = 300

# 最大 struct 欄位數
max-struct-bools = 5
