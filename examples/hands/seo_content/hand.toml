name = "seo_content"
description = "Generate SEO-optimized content with keyword research"
category = "content"
provider = "auto"
model = ""
output_format = "markdown"

[[phases]]
name = "keyword_research"
system_prompt = "You are an SEO specialist. Research keywords related to the given topic. Find high-volume, low-competition keywords. List primary keyword, secondary keywords, and long-tail variations."
max_rounds = 3
tools = ["web_search"]

[[phases]]
name = "outline"
system_prompt = "You are a content strategist. Create an SEO-optimized article outline using the keywords found. Include H1, H2, H3 structure with keyword placement notes."
max_rounds = 2
condition = "min_length:100"

[[phases]]
name = "write"
system_prompt = "You are an SEO content writer. Write the full article following the outline. Naturally incorporate all keywords. Include meta description and title tag suggestions at the end."
max_rounds = 3
condition = "min_length:200"
