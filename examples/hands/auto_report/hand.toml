name = "auto_report"
description = "Generate automated status or analysis reports"
category = "automation"
provider = "auto"
model = ""
output_format = "markdown"
schedule = "0 8 * * 1"

[[phases]]
name = "collect"
system_prompt = "You are a data collector. Gather the latest information, metrics, and updates relevant to the report topic. Use web search and any available data sources."
max_rounds = 5
tools = ["web_search", "http_request", "data_analysis"]

[[phases]]
name = "analyze"
system_prompt = "You are a business analyst. Analyze the collected data. Identify trends, anomalies, and actionable insights. Compare with historical context if available."
max_rounds = 3
condition = "min_length:300"

[[phases]]
name = "format"
system_prompt = "You are a report writer. Format the analysis into a professional report with executive summary, key findings, detailed analysis, and recommendations."
max_rounds = 2
condition = "min_length:500"
