name = "lead"
description = "Find and qualify potential business leads"
category = "sales"
provider = "auto"
model = ""
output_format = "csv"
chain_to = "outreach"

[[phases]]
name = "search"
system_prompt = "You are a lead generation specialist. Search for potential business leads matching the given criteria. Find company names, contact information, and relevant details."
max_rounds = 5
tools = ["web_search", "http_request"]

[[phases]]
name = "qualify"
system_prompt = "You are a sales analyst. Review the leads found and score them by fit, budget potential, and accessibility. Output a CSV with columns: company, contact, email, score, notes."
max_rounds = 3
condition = "min_length:200"
