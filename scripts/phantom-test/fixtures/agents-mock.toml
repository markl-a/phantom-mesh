# Minimal agents.toml that routes the master agent through a local mock
# LLM server (lib/mock-llm-server.py). Used only inside test scenarios that
# need a deterministic, $0, sub-50ms LLM. NOT for production use.
#
# How scenarios use this:
#   1. start mock server in background:  python3 lib/mock-llm-server.py \
#        --port 11999 --responses fixtures/mock-responses.toml &
#   2. create temp dir, copy this file as ./agents.toml
#   3. cd to temp dir, run `phantom repl --agent master -c "ping"`
#   4. assert output matches the scripted response ("pong")
#   5. kill the mock server
#
# `lib/mock.sh` wraps steps 1, 2, 3, 5 — see scenario 12 for example.

[core]
host = "127.0.0.1"
port = 17878          # off the default 7878/7879 to avoid clobbering a real serve

# No [cluster] section — these scenarios don't exercise cluster RPC; they
# verify provider-call + agent-output plumbing.

[providers.mock]
type          = "openai_compat"
url           = "http://127.0.0.1:11999/v1"
api_key       = "mock-no-auth"
default_model = "mock-instant"

[agent.master]
provider     = "mock"
model        = "mock-instant"
tools        = ["shell", "file_read", "file_write", "content_search"]
instructions = "You are MockBot. Respond exactly as your fixture dictates."
