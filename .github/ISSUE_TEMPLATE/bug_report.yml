name: 🐛 Bug 回報（Bug report）
description: 回報缺陷，協助我們改善 Spectyn Mesh
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感謝你花時間回報問題！請盡量填寫下列欄位，資訊越完整，越快能重現與修復。
        > ⚠️ 請勿在內容中貼上任何密鑰（secret）、API key、私有 Tailscale IP、主機名或個人路徑。
  - type: textarea
    id: what-happened
    attributes:
      label: 發生了什麼？（What happened?）
      description: 清楚描述問題，以及你預期的正確行為。
      placeholder: 我執行 X，預期 Y，實際卻發生 Z。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 重現步驟（Steps to reproduce）
      description: 可複製即測的步驟（實際指令或點擊路徑）。
      placeholder: |
        1. 執行 `spectyn ...`
        2. 點選 ...
        3. 觀察到 ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 介面（Surface）
      description: 問題出現在哪個介面？
      options:
        - CLI
        - App（桌面 / Desktop）
        - App（手機 / Mobile）
        - serve（常駐服務 / daemon）
        - MCP
        - 其他 / 不確定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本（Version）
      description: "`spectyn --version` 的輸出。"
      placeholder: spectyn 0.6.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 作業系統（OS）
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
        - Android
        - iOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相關日誌（Relevant log output）
      description: 貼上 `spectyn logs --tail` 或主控台輸出（請先移除密鑰／個資）。會自動以程式碼格式呈現。
      render: shell
    validations:
      required: false
