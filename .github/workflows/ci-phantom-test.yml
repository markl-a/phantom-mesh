name: CI phantom-test (scenario harness)

# Black-box scenario harness from scripts/phantom-test/. Complements the
# in-tree `cargo test --lib` (which ci-fast.yml already runs) by exercising
# the wire protocol, on-disk state, and CLI surface of a built phantom
# binary against a live `phantom serve`.
#
# CI-safe scenario subset (no real LLM keys, no Tailscale, no remote peer):
#   01 doctor baseline
#   03 RPC HMAC — bad secret rejected
#   09 events.jsonl grows on activity
#   10 RPC bogus job-id error
#   12 mock LLM end-to-end (uses lib/mock-llm-server.py — $0, sub-50ms)
#   18 MCP stdio tools/list
#   22 service status reports autostart registration
#   23 RPC malformed body fails cleanly (no 5xx / no panic)
#   24 RPC missing auth header rejected
#
# Other scenarios (02/04/06/11/13–17/19–21/25) need real provider keys or
# a multi-host cluster — they'll be added back once we have repo secrets
# wired up for tier-rate-limited free providers (groq / opencode-zen).

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/phantom-test/**'
      - '.github/workflows/ci-phantom-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/phantom-test/**'
      - '.github/workflows/ci-phantom-test.yml'

# Cancel superseded runs on the same branch/PR — saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  scenario-harness:
    name: phantom-test scenario harness (CI-safe subset)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssl curl jq
          # Python is preinstalled on ubuntu-latest; just confirm.
          python3 --version

      - name: Build phantom (release)
        working-directory: core
        run: cargo build --release --bin phantom

      - name: Install phantom on PATH
        run: |
          install -m 755 core/target/release/phantom /usr/local/bin/phantom
          phantom --version

      - name: Bootstrap minimal config (no real LLM keys)
        run: |
          mkdir -p ~/.phantom-mesh
          cat > ~/.phantom-mesh/agents.toml <<'EOF'
          [core]
          host = "127.0.0.1"
          port = 7879

          [cluster]
          # Match PHANTOM_CLUSTER_SECRET default in scripts/phantom-test/lib/common.sh
          secret = "phantom-cluster-2026"

          # No [providers.*] sections — scenarios that need a real LLM will
          # skip cleanly via exit 77 (graceful no-key handling) or fail with
          # a clean error (precisely what scenario 07 verifies). Scenario 12
          # provides its OWN mock provider per-test in a temp cwd.
          EOF

      - name: Start phantom serve (background)
        run: |
          # Detached so the workflow step can finish; harness scenarios
          # talk to it over HTTP. Logs land in /tmp for upload on failure.
          nohup phantom serve > /tmp/phantom-serve.log 2>&1 &
          echo $! > /tmp/phantom-serve.pid
          echo "phantom serve PID: $(cat /tmp/phantom-serve.pid)"

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7879/healthz > /dev/null; then
              echo "✓ phantom serve up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "✗ phantom serve never responded on /healthz"
          tail -50 /tmp/phantom-serve.log
          exit 1

      - name: Run CI-safe scenario subset
        env:
          PHANTOM_BIN: /usr/local/bin/phantom
          PHANTOM_HOST: 127.0.0.1
          PHANTOM_PORT: '7879'
          PHANTOM_CLUSTER_SECRET: phantom-cluster-2026
          NO_COLOR: '1'
        run: |
          # Curated prefix list — see workflow header for what each tests.
          bash scripts/phantom-test/harness.sh 01 03 09 10 12 18 22 23 24

      - name: Stop phantom serve
        if: always()
        run: |
          if [ -f /tmp/phantom-serve.pid ]; then
            kill "$(cat /tmp/phantom-serve.pid)" 2>/dev/null || true
          fi

      - name: Upload phantom-serve log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phantom-serve-log
          path: |
            /tmp/phantom-serve.log
            ~/.phantom-mesh/events.jsonl
            ~/.phantom-mesh/crashes/
          if-no-files-found: ignore
          retention-days: 7
