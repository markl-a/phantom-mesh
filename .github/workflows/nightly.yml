name: Nightly

on:
  schedule:
    # Every day at midnight UTC.
    - cron: "0 0 * * *"
  # Allow manual trigger for ad-hoc runs.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PHANTOM_MESH_CI: "1"

jobs:
  # ── Full test suite (default features) ──────────────────────────────────
  full-test:
    name: Full Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-${{ matrix.os }}

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Run lib tests
        run: cargo test --lib -- --test-threads=4

      - name: Run integration tests
        run: cargo test --test integration -- --test-threads=2

      - name: Run doc tests
        run: cargo test --doc

  # ── Full test suite (pg feature, Linux only) ────────────────────────────
  full-test-pg:
    name: Full Test Suite (pg feature)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: phantom-mesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-pg

      - name: Run all tests (pg feature)
        run: cargo test --all-targets --features pg -- --test-threads=2
        env:
          PHANTOM_MESH_PG_URL: "postgresql://postgres:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/phantom-mesh_test"

  # ── Security audit ───────────────────────────────────────────────────────
  audit:
    name: Security Audit (cargo audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Audit against the RustSec advisory database. Fails the job if any
        # known vulnerability is found in direct or transitive dependencies.
        run: cargo audit

  # ── License & dependency policy (cargo deny) ────────────────────────────
  deny:
    name: Cargo Deny (licenses & advisories)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses, advisories, and bans
        # deny.toml at repo root controls the policy.
        run: cargo deny check

  # ── Nightly Rust compatibility check ────────────────────────────────────
  nightly-compat:
    name: Nightly Rust Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Build on nightly (warnings allowed — informational only)
        run: cargo +nightly build --all-targets 2>&1 || true

      - name: Clippy on nightly (informational only)
        run: cargo +nightly clippy --all-targets -- -W clippy::all 2>&1 || true
