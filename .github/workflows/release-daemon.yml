# COST WORKAROUND 2026-05-17: the build-macos job below (macos-latest,
# 10x Linux cost) only runs on workflow_dispatch. Tag pushes still build
# Linux + Windows (cross-compiled on ubuntu, both cheap) + Android (ubuntu)
# to keep the bulk of the daemon release pipeline auto-triggered. The
# `release` job depends on build-macos with `if: always()` so the GitHub
# Release is still cut even if macOS artifacts are absent. To produce the
# macOS arm64 + x86_64 daemon binaries, run manually:
#   gh workflow run release-daemon.yml -f draft=true
# Revert when the billing cycle resets or a self-hosted runner is online.
name: Release Daemon Binaries

# Serialize per-ref so two near-simultaneous tag pushes can't race two parallel
# runs creating duplicate GitHub Releases for the same ref. cancel-in-progress
# false: never abort a release mid-upload, just queue (T-WLA-14).
concurrency:
  group: release-daemon-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Linux targets (x86_64 + aarch64) — built with `cross` inside Docker
  # ──────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: spectyn-mesh-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            asset_name: spectyn-mesh-aarch64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-${{ matrix.target }}-cargo-

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path core/Cargo.toml

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/spectyn-mesh ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Windows x86_64 — cross-compiled with cross (mingw toolchain)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-x86_64-cargo-

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build with cross
        run: cross build --release --target x86_64-pc-windows-gnu --manifest-path core/Cargo.toml

      - name: Rename binary
        run: cp target/x86_64-pc-windows-gnu/release/spectyn-mesh.exe spectyn-mesh-x86_64-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectyn-mesh-x86_64-windows
          path: spectyn-mesh-x86_64-windows.exe
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # macOS — built natively on macos-latest (Apple Silicon runner)
  # Both arm64 and x86_64 can be produced from the same runner via rustup
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    # COST WORKAROUND 2026-05-17: macos-latest is 10x Linux cost.
    # Skip on tag push; run via `gh workflow run release-daemon.yml`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_name: spectyn-mesh-aarch64-macos
          - target: x86_64-apple-darwin
            asset_name: spectyn-mesh-x86_64-macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: macos-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-${{ matrix.target }}-cargo-

      - name: Build
        working-directory: core
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp core/target/${{ matrix.target }}/release/spectyn-mesh ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Android aarch64 — built with the official NDK + cargo-ndk
  # Termux/coordinator distribution: <coord>/dist/spectyn-aarch64-linux-android
  # (consumed by scripts/termux-setup.sh and docs/INSTALL-ANDROID.md §B.2)
  # Only the `spectyn` user-facing binary is shipped — `spectyn-mesh` daemon
  # is not exercised on Termux.
  # ──────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android aarch64
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: '28.2.13676358'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK_HOME"   >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME"   >> "$GITHUB_ENV"

      - name: Install Rust + aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-aarch64-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build with cargo-ndk
        working-directory: core
        # API 21 matches package-android.sh; only build the `spectyn` REPL bin.
        run: cargo ndk -t arm64-v8a -P 21 build --release --bin spectyn

      - name: Strip and rename binary
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          BIN="core/target/aarch64-linux-android/release/spectyn"
          "$NDK_BIN/llvm-strip" "$BIN" -o spectyn-aarch64-linux-android
          ls -lh spectyn-aarch64-linux-android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectyn-aarch64-linux-android
          path: spectyn-aarch64-linux-android
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Create GitHub Release and attach all binaries
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos, build-android]
    # COST WORKAROUND 2026-05-17: tolerate skipped build-macos so the
    # release is still cut from Linux + Windows + Android on tag push.
    # We require the three non-mac jobs to have succeeded; build-macos may
    # be skipped (cancelled or success are also fine).
    if: |
      always()
      && needs.build-linux.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.build-android.result == 'success'
      && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifact directories
        run: |
          mkdir -p release-assets
          find dist/ -type f | while read f; do
            cp "$f" release-assets/
          done
          ls -lh release-assets/

      # Emit per-asset .sha256 sidecars AND a combined SHA256SUMS manifest.
      # Install scripts consume the per-asset sidecars (e.g. install-mac.sh
      # downloads "<binary>.sha256" and compares before chmod +x).
      # See scripts/_verify-download.sh and docs/install-binary-verification.md.
      - name: Generate SHA256 sidecars + manifest
        working-directory: release-assets
        run: |
          # Per-asset sidecar: <name>.sha256 contains "<hex>  <name>"
          for f in *; do
            [ -f "$f" ] || continue
            # Skip if this is already a sidecar (idempotent).
            case "$f" in *.sha256|SHA256SUMS) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
          # Combined manifest, also published as a release asset.
          sha256sum * 2>/dev/null | grep -v '\.sha256$' | grep -v 'SHA256SUMS' > SHA256SUMS || true
          echo "── SHA256SUMS ──"
          cat SHA256SUMS
          echo "── sidecars ──"
          ls -lh *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: ${{ github.event.inputs.draft || 'true' }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
