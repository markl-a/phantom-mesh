# COST WORKAROUND 2026-05-17: macOS/Windows auto-trigger removed from the
# PR build matrix to stop burning the GitHub Actions monthly quota
# (macOS = 10x Linux, Windows = 2x Linux). PRs now only build on
# ubuntu-latest. To run the full ubuntu+windows+macos matrix on demand,
# trigger this workflow manually via `gh workflow run ci-medium.yml` or
# the Actions tab. Revert when the billing cycle resets or a self-hosted
# runner is available.
name: CI Medium

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'app/**'
      - 'Cargo.lock'
      - '.github/workflows/ci-medium.yml'
  workflow_dispatch:

# Cancel superseded runs on the same PR — saves CI minutes during rapid push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # COST WORKAROUND 2026-05-17: PRs build ubuntu-only. Full matrix
        # (incl. windows-latest + macos-latest) runs on workflow_dispatch.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Cargo build (release)
        working-directory: core
        run: cargo build --release

      - name: Cargo test (lib)
        working-directory: core
        # Serial: unit tests share process-global env vars (see ci-fast.yml).
        run: cargo test --lib -- --test-threads=1

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build daemon
        run: cargo build --release
        working-directory: core
      - name: Run integration tests
        run: |
          cp core/target/release/phantom-mesh .
          bash scripts/integration-test.sh
        env:
          BINARY: ./phantom-mesh
