name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# Cancel in-progress runs for the same branch so new pushes supersede stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Prevent CI from attempting live LLM connections.
  PHANTOM_MESH_CI: "1"

jobs:
  # ── Build & Test matrix ──────────────────────────────────────────────────
  build-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          # Also verify MSRV (minimum supported Rust version).
          - os: ubuntu-latest
            rust: "1.75.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-test-${{ matrix.os }}-${{ matrix.rust }}

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Run lib tests
        run: cargo test --lib -- --test-threads=4

      - name: Run integration tests
        # tests/integration.rs — cluster_acceptance/simulate/verify require a
        # live cluster and are intentionally excluded from CI.
        run: cargo test --test integration -- --test-threads=2

  # ── Clippy ──────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.os }}

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Rustfmt ─────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check
