name: CI

on:
  push:
  pull_request:

jobs:
  static-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/qa_static_site.py
      - run: pip install pytest
      - run: python -m pytest scripts/tests/test_qa_static_site.py -q
