name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: phantom-mesh

# Permissions needed to create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  # ── Build release binaries ───────────────────────────────────────────────
  build:
    name: Build release binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64 — built natively.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: phantom-mesh-linux-x86_64
            use_cross: false

          # Windows x86-64 — built natively.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: phantom-mesh-windows-x86_64.exe
            use_cross: false

          # macOS Apple Silicon — built natively on macOS-latest (M1 runner).
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: phantom-mesh-macos-aarch64
            use_cross: false

          # Linux ARM64 — cross-compiled via `cross`.
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: phantom-mesh-linux-aarch64
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # Install `cross` for cross-compilation targets.
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      # Native build.
      - name: Build release binary (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      # Cross-compiled build.
      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      # Rename the binary to the platform-specific artifact name and upload it.
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} \
             ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" `
                    "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  # ── Create GitHub Release ────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Extract release notes from tag annotation
        id: notes
        run: |
          # Use the git tag annotation body as release notes, falling back to a
          # simple default if the tag is lightweight (no annotation).
          NOTES=$(git tag -l --format='%(contents)' "${{ github.ref_name }}" 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ github.ref_name }}"
          fi
          # Multiline-safe: use environment file.
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Phantom Mesh-Core ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
