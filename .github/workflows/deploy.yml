# ============================================================================
# Clawtex-Core 自動部署管線
# 觸發：CI 通過後自動部署
# 流程：CI pass → staging (Acer) → E2E 驗證 → production (Z13 Hub)
# ============================================================================

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, "release/*"]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. 部署到 Staging ──────────────────────────────────────────────────
  deploy-staging:
    name: "Deploy to Staging (Acer)"
    runs-on: self-hosted
    # 只在 CI 成功時部署
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
      url: http://acer.local:7878/status
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ${DOCKER_IMAGE}:main

      - name: Deploy to staging
        run: |
          # 停止舊容器
          ssh ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} << 'DEPLOY_EOF'
            cd /opt/clawtex
            docker compose pull
            docker compose up -d --force-recreate clawtex-core
            # 等待健康檢查通過
            for i in $(seq 1 30); do
              if curl -sf http://localhost:7878/status > /dev/null 2>&1; then
                echo "Staging is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: Staging health check failed"
            docker compose logs clawtex-core --tail=50
            exit 1
          DEPLOY_EOF

      - name: Run smoke tests on staging
        run: |
          # 基本 API 回應
          curl -sf http://${{ secrets.STAGING_HOST }}:7878/status | jq .
          # E-Stop 功能
          curl -sf -X POST http://${{ secrets.STAGING_HOST }}:7878/estop
          curl -sf http://${{ secrets.STAGING_HOST }}:7878/estop | jq -e '.stopped == true'
          curl -sf -X DELETE http://${{ secrets.STAGING_HOST }}:7878/estop
          # Hands 清單
          curl -sf http://${{ secrets.STAGING_HOST }}:7878/hands | jq .

  # ── 2. Staging E2E 測試 ────────────────────────────────────────────────
  staging-e2e:
    name: "Staging E2E Tests"
    needs: deploy-staging
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run E2E tests against staging
        run: |
          CLAWTEX_URL="http://${{ secrets.STAGING_HOST }}:7878" \
          cargo test --test e2e -- --test-threads=1
        env:
          CLAWTEX_CI: "1"
          RUST_BACKTRACE: 1

  # ── 3. 部署到 Production ───────────────────────────────────────────────
  deploy-production:
    name: "Deploy to Production (Z13 Hub)"
    needs: staging-e2e
    runs-on: self-hosted
    # 只在 release 分支自動部署到 production
    if: startsWith(github.event.workflow_run.head_branch, 'release/')
    environment:
      name: production
      url: http://z13.local:7878/status
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production (Z13)
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }} << 'DEPLOY_EOF'
            cd /opt/clawtex

            # 滾動更新 — 先啟動新容器再停舊的
            docker compose pull
            docker compose up -d --no-deps --force-recreate clawtex-core

            # 健康檢查
            for i in $(seq 1 30); do
              if curl -sf http://localhost:7878/status > /dev/null 2>&1; then
                echo "Production is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: Production health check failed — rolling back"
            docker compose rollback clawtex-core 2>/dev/null || true
            exit 1
          DEPLOY_EOF

      - name: Verify production
        run: |
          curl -sf http://${{ secrets.PROD_HOST }}:7878/status | jq .
          echo "Production deployment successful"

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "OK" || echo "FAIL")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=[${EMOJI}] clawtex-core deploy to production: ${STATUS}
          Branch: ${{ github.event.workflow_run.head_branch }}
          Commit: ${{ github.event.workflow_run.head_sha }}"

  # ── 4. 更新 Worker 節點 ────────────────────────────────────────────────
  deploy-workers:
    name: "Update Worker Nodes"
    needs: deploy-production
    runs-on: self-hosted
    strategy:
      max-parallel: 1  # 滾動更新：一次一台
      matrix:
        worker: [acer, ayaneo, nuc]
    steps:
      - name: Update ${{ matrix.worker }}
        run: |
          ssh ${{ secrets[format('{0}_SSH_USER', matrix.worker)] }}@${{ secrets[format('{0}_HOST', matrix.worker)] }} << 'DEPLOY_EOF'
            cd /opt/clawtex
            docker compose pull
            docker compose up -d --force-recreate clawtex-core

            for i in $(seq 1 30); do
              if curl -sf http://localhost:7878/status > /dev/null 2>&1; then
                echo "${{ matrix.worker }} is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: ${{ matrix.worker }} health check failed"
            exit 1
          DEPLOY_EOF
