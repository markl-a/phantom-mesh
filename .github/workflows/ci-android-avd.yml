name: ci-android-avd
on:
  # COST WORKAROUND 2026-05-17 freeze: macos-13 (AVD hardware-accel) is the most
  # expensive runner class — do NOT auto-fire on PR. Operator-triggered only
  # (`gh workflow run ci-android-avd.yml`). Restore the pull_request trigger when
  # billing resets / a self-hosted macOS runner lands.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-avd-smoke:
    name: Android AVD cap-mismatch smoke
    runs-on: macos-13  # AVD requires hardware accel only available on macOS runners
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-arm64

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build spectyn for Android aarch64
        run: |
          set -e
          cd core
          cargo build --release --target aarch64-linux-android --bin spectyn

      - name: Start Android AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # Push spectyn binary to AVD
            adb push core/target/aarch64-linux-android/release/spectyn /data/local/tmp/spectyn
            adb shell chmod +x /data/local/tmp/spectyn

            # Start spectyn serve with mock worker_caps (no real Android caps, just claim them)
            adb shell "SPECTYN_WORKER_CAPS='android,camera,gps' /data/local/tmp/spectyn serve --port 17878 &"
            sleep 3

            # Forward port
            adb forward tcp:17878 tcp:17878

            # Test 1: advertise (peer should announce worker_caps)
            echo "=== test 1: advertise ==="
            curl -s http://127.0.0.1:17878/healthz | head -5

            # Test 2: cap-mismatch reject — dispatch with required-caps=["windows"]
            # (Android peer has android+camera+gps, NOT windows → server-side filter rejects)
            echo "=== test 2: mismatch reject ==="
            curl -s -X POST http://127.0.0.1:17878/rpc/task/assign \
              -H 'Content-Type: application/json' \
              -d '{"task_id":"t1","required_caps":["windows"],"prompt":"echo hello"}' \
              -w "\nHTTP_STATUS:%{http_code}\n" | head -5

            # Test 3: matching accept — dispatch with required-caps=["android"]
            echo "=== test 3: matching accept ==="
            curl -s -X POST http://127.0.0.1:17878/rpc/task/assign \
              -H 'Content-Type: application/json' \
              -d '{"task_id":"t2","required_caps":["android"],"prompt":"echo hello"}' \
              -w "\nHTTP_STATUS:%{http_code}\n" | head -5

            # Cleanup
            adb shell "killall spectyn || true"

      - name: Upload AVD logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: avd-logs
          path: |
            ~/.android/adb.log
            /tmp/spectyn-*.log
          retention-days: 7
