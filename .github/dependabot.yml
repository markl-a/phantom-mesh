# Dependabot 設定：自動偵測相依套件更新並開 PR
# 文件：https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # --- Rust / Cargo（workspace 根目錄，涵蓋 core、app/src-tauri、crates/*） ---
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"

  # --- 前端 App（Tauri + React） ---
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"

  # --- phantommesh-io（網站 / 服務） ---
  - package-ecosystem: "npm"
    directory: "/phantommesh-io"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"

  # --- phantommesh-io 儀表板（dashboard） ---
  - package-ecosystem: "npm"
    directory: "/phantommesh-io/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"

  # --- GitHub Actions workflow 自身的相依 ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
