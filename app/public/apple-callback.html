<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spectyn Mesh - Apple Sign In</title>
<style>
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { text-align: center; padding: 2rem; }
  .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #6c63ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <p>正在跳轉回 Spectyn Mesh...</p>
  <p id="fallback" style="display:none; margin-top:1rem;">
    <small>如未自動跳轉，請手動回到 Spectyn Mesh 桌面應用。</small>
  </p>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var state = params.get('state') || '';
  // State format: {csrf_token}.{port}
  var dotIdx = state.lastIndexOf('.');
  if (dotIdx === -1) {
    document.getElementById('fallback').style.display = 'block';
    return;
  }
  var port = state.substring(dotIdx + 1);
  if (!/^\d{4,5}$/.test(port)) {
    document.getElementById('fallback').style.display = 'block';
    return;
  }
  // Redirect to Tauri's localhost callback with all params
  window.location.replace('http://localhost:' + port + '/callback' + window.location.search);
  // Show fallback after 3s in case redirect fails
  setTimeout(function() {
    document.getElementById('fallback').style.display = 'block';
  }, 3000);
})();
</script>
</body>
</html>
