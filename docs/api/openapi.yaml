openapi: "3.0.3"
info:
  title: Phantom Mesh API
  description: |
    Phantom Mesh is a Rust daemon providing LLM routing, multi-agent orchestration, distributed
    cluster management, hands workflow automation, and full observability. Default port: 7878.

    **Authentication**: All endpoints (except /health and /dashboard) require a Bearer token:
    ```
    Authorization: Bearer <hub_api_key>
    ```
    The key is either set in agents.toml under `[core] hub_api_key` or auto-generated on startup
    (printed to logs as `Hub API key: <first-16-chars>...`).

    **E-Stop**: If emergency stop is active, agent/hand/dispatch endpoints return
    `{"error": "E-Stop active"}` rather than a 5xx error.
  version: "1.0.0"
servers:
  - url: "http://localhost:7878"
    description: Local Hub (Z13, primary)
  - url: "http://10.0.2.1:7879"
    description: M1 Mac Worker
  - url: "http://10.0.2.2:7880"
    description: AYANEO Worker
  - url: "http://10.0.1.1:7881"
    description: Acer Worker

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 0.1.0 }
        service: { type: string, example: phantom-mesh }

    LlmRouteRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        provider:
          type: string
          default: auto
          description: "Provider name or 'auto' for smart routing. Options: ollama, gemini, groq, chatgpt, codex, opencode, cerebras, openrouter, lmstudio, npu"

    AgentRunRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }

    AgentRunResponse:
      type: object
      properties:
        agent: { type: string }
        result: { type: string }
        tool_calls: { type: integer }
        elapsed: { type: number, format: float }

    ClusterNode:
      type: object
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        status: { type: string, enum: [online, offline, unknown] }
        cpu_load: { type: number, format: float }
        capabilities: { type: array, items: { type: string } }
        device_type: { type: string, enum: [full, light, mobile] }
        inflight: { type: integer }

    DispatchRequest:
      type: object
      required: [tool]
      properties:
        tool: { type: string, description: Tool name to dispatch }
        input: { type: object, description: Tool input parameters }
        worker: { type: string, description: Target specific worker by name }
        capability: { type: string, description: Target best worker with this capability }

    HandRunRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }

    HandRunResponse:
      type: object
      properties:
        hand: { type: string }
        phases_completed: { type: integer }
        total_phases: { type: integer }
        final_output: { type: string }
        elapsed_secs: { type: number }
        phase_details:
          type: array
          items:
            type: object
            properties:
              phase: { type: string }
              tool_calls: { type: integer }
              output_length: { type: integer }
        chained_hand:
          type: object
          description: Result of automatically chained next hand (if chain_to configured)

    EStopStatus:
      type: object
      properties:
        stopped: { type: boolean }
        status: { type: string, enum: [stopped, running] }
        message: { type: string }

    DiagnoseRequest:
      type: object
      required: [error_message]
      properties:
        error_message: { type: string }
        agent_name: { type: string }
        tool_name: { type: string }
        hand_name: { type: string }
        phase: { type: integer }
        stack_trace: { type: string }
        recent_logs: { type: array, items: { type: string } }

    OrderCreateRequest:
      type: object
      required: [customer_name]
      properties:
        customer_name: { type: string }
        customer_email: { type: string }
        service_tier: { type: string, default: standard }
        amount_usd: { type: number }
        assigned_agent: { type: string }

    TenantCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        tier: { type: string, enum: [lite, standard, pro, enterprise], default: lite }

paths:
  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      summary: Health check (no auth required)
      operationId: getHealth
      security: []
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /metrics:
    get:
      summary: Prometheus metrics (text/plain)
      operationId: getMetrics
      tags: [Health]
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              example: |
                phantom_mesh_uptime_seconds 3600
                phantom_mesh_workers_online 4
                phantom_mesh_tools_registered 42

  /metrics/health:
    get:
      summary: JSON health summary
      operationId: getMetricsHealth
      tags: [Health]
      responses:
        "200":
          description: Health summary object

  /dashboard:
    get:
      summary: Web dashboard HTML (no Bearer auth, token in query)
      operationId: getDashboard
      security: []
      tags: [Health]
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Dashboard token (auto-generated; shown in logs)
      responses:
        "200":
          description: HTML dashboard page
        "403":
          description: Invalid token

  # ── Agent ───────────────────────────────────────────────────────────────────
  /llm/route:
    post:
      summary: Route a prompt to an LLM provider
      operationId: routeLlm
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmRouteRequest" }
            example:
              prompt: "Summarize the latest AI trends"
              provider: auto
      responses:
        "200":
          description: LLM response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: { type: string }
                  provider: { type: string }

  /task:
    post:
      summary: Add a task to the queue
      operationId: addTask
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                prompt: { type: string, description: Defaults to title if omitted }
      responses:
        "200":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  status: { type: string, example: pending }

  /task/{id}/run:
    post:
      summary: Execute a queued task by ID
      operationId: runTask
      tags: [Agent]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Task result
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  result: { type: string }
                  status: { type: string, example: done }

  /task/history:
    get:
      summary: List recent task history (last 20)
      operationId: getTaskHistory
      tags: [Agent]
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array }

  /agent/{name}/run:
    post:
      summary: Run a named agent with a prompt (stateless HTTP)
      operationId: runAgent
      tags: [Agent]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, example: master }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRunRequest" }
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunResponse" }

  /stream/agent/{name}:
    get:
      summary: Server-Sent Events stream for agent responses
      operationId: streamAgent
      tags: [Agent]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: prompt, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              example: |
                event: content
                data: Hello world

                event: tool_start
                data: {"id":"call_1","name":"web_search"}

                event: done
                data: {"total_tokens":512}

  /ws/agent/{name}:
    get:
      summary: WebSocket for bidirectional agent communication
      operationId: wsAgent
      tags: [Agent]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "101":
          description: WebSocket upgrade. Client sends JSON with "prompt" key; server replies with event objects.

  /events/agent/{name}:
    get:
      summary: Subscribe to agent event bus (SSE)
      operationId: getAgentEvents
      tags: [Agent]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: SSE stream of AgentEvent objects

  /agent/think:
    post:
      summary: Hub-side reasoning for mobile workers (rate-limited 10 req/min per worker)
      operationId: agentThink
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker, prompt]
              properties:
                worker: { type: string, description: Worker device name }
                prompt: { type: string }
                history: { type: array, description: Previous conversation turns }
                available_tools: { type: array, items: { type: string } }
      responses:
        "200":
          description: Reasoning response with next_tool and tool_args

  # ── Hands ───────────────────────────────────────────────────────────────────
  /hands:
    get:
      summary: List all registered workflow hands
      operationId: listHands
      tags: [Hands]
      responses:
        "200":
          description: Hands list
          content:
            application/json:
              schema:
                type: object
                properties:
                  hands:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        category: { type: string }
                        phases: { type: integer }
                        tools: { type: array, items: { type: string } }
                  count: { type: integer }

  /hand/{name}/run:
    post:
      summary: Execute a named hand workflow
      operationId: runHand
      tags: [Hands]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, example: content }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandRunRequest" }
            example:
              prompt: "Write a tweet about Rust async programming"
      responses:
        "200":
          description: Hand execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandRunResponse" }

  # ── Tools ───────────────────────────────────────────────────────────────────
  /tools:
    get:
      summary: List all registered tools with descriptions
      operationId: listTools
      tags: [Tools]
      responses:
        "200":
          description: Tool list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }

  /workspace/files:
    get:
      summary: List files in agent workspace directory (~/.phantom-mesh/workspace/)
      operationId: listWorkspaceFiles
      tags: [Tools]
      responses:
        "200":
          description: File listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: { type: array }
                  count: { type: integer }
                  workspace: { type: string }

  # ── Cluster ─────────────────────────────────────────────────────────────────
  /cluster/status:
    get:
      summary: Get status of all registered cluster nodes
      operationId: getClusterStatus
      tags: [Cluster]
      responses:
        "200":
          description: Node status list including offline nodes

  /cluster/workers:
    get:
      summary: List all currently online cluster workers
      operationId: getClusterWorkers
      tags: [Cluster]
      responses:
        "200":
          description: Online workers
          content:
            application/json:
              schema:
                type: object
                properties:
                  workers:
                    type: array
                    items: { $ref: "#/components/schemas/ClusterNode" }
                  count: { type: integer }

  /cluster/register:
    post:
      summary: Worker self-registration with the hub
      operationId: clusterRegister
      tags: [Cluster]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, host]
              properties:
                name: { type: string }
                host: { type: string }
                port: { type: integer, default: 7879 }
                capabilities: { type: array, items: { type: string } }
                device_type: { type: string, default: full, enum: [full, light, mobile] }
            example:
              name: acer
              host: 10.0.1.1
              port: 7881
              capabilities: [web_search, http_request]
              device_type: light
      responses:
        "200":
          description: Registration confirmed

  /cluster/heartbeat:
    post:
      summary: Worker heartbeat with CPU load update
      operationId: clusterHeartbeat
      tags: [Cluster]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                cpu_load: { type: number, format: float, minimum: 0.0, maximum: 1.0 }
      responses:
        "200":
          description: Heartbeat accepted

  /cluster/dispatch:
    post:
      summary: Dispatch a tool call to a cluster worker
      operationId: clusterDispatch
      tags: [Cluster]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchRequest" }
            examples:
              auto:
                value: { tool: web_search, input: { query: "AI news 2026" } }
              targeted:
                value: { tool: shell, input: { command: "uname -a" }, worker: m1-mac }
              byCapability:
                value: { tool: sensor_gps, input: {}, capability: gps }
      responses:
        "200":
          description: Tool execution result from worker

  /cluster/poll:
    get:
      summary: Mobile worker polls for next pending task (acts as heartbeat too)
      operationId: clusterPoll
      tags: [Cluster]
      parameters:
        - { name: worker, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Task or idle status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [idle, task, agent_task] }
                  task_id: { type: string }
                  tool: { type: string }
                  input: { type: object }
                  goal: { type: string }
                  max_iterations: { type: integer }
                  available_tools: { type: array, items: { type: string } }

  /cluster/result:
    post:
      summary: Mobile worker submits completed task result
      operationId: clusterResult
      tags: [Cluster]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, success, output]
              properties:
                task_id: { type: string }
                success: { type: boolean }
                output: { type: string }
                worker: { type: string }
      responses:
        "200":
          description: Result accepted

  /cluster/metrics:
    get:
      summary: Cluster-wide performance metrics snapshot
      operationId: getClusterMetrics
      tags: [Cluster]
      responses:
        "200":
          description: Metrics data (tasks_dispatched, success_rate, latency per worker)

  /cluster/metrics/{worker}:
    get:
      summary: Per-worker performance statistics
      operationId: getClusterMetricsWorker
      tags: [Cluster]
      parameters:
        - { name: worker, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Worker stats

  /cluster/health:
    get:
      summary: Circuit breaker states and watchdog recovery events
      operationId: getClusterHealth
      tags: [Cluster]
      responses:
        "200":
          description: Health including circuit_breakers array and watchdog_events

  /cluster/onboard:
    post:
      summary: Start automated onboarding for a new worker
      operationId: clusterOnboard
      tags: [Cluster]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: OnboardConfig (worker_name, worker_type, ssh_host, ssh_user, etc.)
      responses:
        "200":
          description: Onboarding result with steps completed

  /cluster/onboard/status/{worker}:
    get:
      summary: Check onboarding status for a worker
      operationId: clusterOnboardStatus
      tags: [Cluster]
      parameters:
        - { name: worker, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Onboarding state and health

  /cluster/onboard/verify/{worker}:
    get:
      summary: Verify worker health post-onboarding
      operationId: clusterOnboardVerify
      tags: [Cluster]
      parameters:
        - { name: worker, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Health check result

  /cluster/onboard/mobile:
    post:
      summary: Generate mobile worker join deep link and pre-register
      operationId: clusterOnboardMobile
      tags: [Cluster]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_name, hub_url]
              properties:
                worker_name: { type: string }
                hub_url: { type: string }
                auth_token: { type: string }
                capabilities: { type: array, items: { type: string } }
      responses:
        "200":
          description: Deep link for mobile app

  /cluster/consistency-test:
    post:
      summary: Run cross-device LLM consistency tests
      operationId: clusterConsistencyTest
      tags: [Cluster]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threshold: { type: number, default: 0.90 }
                predefined: { type: boolean, default: false }
                workers: { type: array, items: { type: string } }
                prompts: { type: array, items: { type: string } }
      responses:
        "200":
          description: Consistency test results with similarity scores

  /cluster/consistency-history:
    get:
      summary: View historical consistency test results
      operationId: getClusterConsistencyHistory
      tags: [Cluster]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Summary and recent reports

  /cluster/preemption/pending:
    get:
      summary: List pending task preemption restorations
      operationId: getPreemptionPending
      tags: [Cluster]
      responses:
        "200":
          description: Pending restoration records

  /cluster/preemption/history:
    get:
      summary: Task preemption event history
      operationId: getPreemptionHistory
      tags: [Cluster]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Preemption records

  /cluster/scores:
    get:
      summary: Node capability rankings (stability, speed, cost_efficiency, quality, overall)
      operationId: getClusterScores
      tags: [Cluster]
      responses:
        "200":
          description: Rankings with grades

  /cluster/scores/{node}:
    get:
      summary: Detailed score for a specific node
      operationId: getClusterScoreNode
      tags: [Cluster]
      parameters:
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Node metrics and score
    post:
      summary: Update node performance metrics
      operationId: updateClusterScoreNode
      tags: [Cluster]
      parameters:
        - { name: node, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                success_count: { type: integer }
                failure_count: { type: integer }
                avg_latency_ms: { type: number }
                total_cost: { type: number }
                quality_score: { type: number }
      responses:
        "200":
          description: Updated node score

  # ── Cron / Scheduler ────────────────────────────────────────────────────────
  # (Cron is managed via Telegram bot commands /cron list|add|remove
  #  and the daemon registers 6 default jobs on first run.)

  # ── Admin ────────────────────────────────────────────────────────────────────
  /costs:
    get:
      summary: Token usage and cost summary (7-day breakdown by provider/agent/day)
      operationId: getCostsSummary
      tags: [Admin]
      responses:
        "200":
          description: Cost summary

  /revenue:
    get:
      summary: Revenue tracking summary (30-day breakdown by route/source/day)
      operationId: getRevenueSummary
      tags: [Admin]
      responses:
        "200":
          description: Revenue summary

  /reports/daily:
    get:
      summary: Generate and return daily operations report
      operationId: getDailyReport
      tags: [Admin]
      responses:
        "200":
          description: OpsReport object

  /reports/weekly:
    get:
      summary: Generate and return weekly operations report
      operationId: getWeeklyReport
      tags: [Admin]
      responses:
        "200":
          description: OpsReport object

  /reports/send:
    post:
      summary: Generate daily report formatted for Telegram
      operationId: sendReport
      tags: [Admin]
      responses:
        "200":
          description: Report object with telegram_text field

  /tier/{agent}:
    get:
      summary: Get agent service tier and limits
      operationId: getTier
      tags: [Admin]
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tier info with limits and current usage
    put:
      summary: Set agent service tier
      operationId: setTier
      tags: [Admin]
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [lite, standard, pro, enterprise] }
      responses:
        "200":
          description: Tier updated

  /tier/{agent}/usage:
    get:
      summary: Get agent current usage stats (tasks today, storage used)
      operationId: getTierUsage
      tags: [Admin]
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Usage stats

  /audit:
    get:
      summary: Query audit log with optional filters
      operationId: getAuditLog
      tags: [Admin]
      parameters:
        - { name: agent, in: query, schema: { type: string } }
        - { name: action_type, in: query, schema: { type: string } }
        - { name: risk_level, in: query, schema: { type: string } }
        - { name: tool, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Audit entries with count

  /tenants:
    post:
      summary: Create a new tenant
      operationId: createTenant
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreateRequest" }
      responses:
        "200":
          description: Tenant object
    get:
      summary: List all tenants
      operationId: listTenants
      tags: [Admin]
      responses:
        "200":
          description: Tenant list

  /tenants/validate:
    get:
      summary: Validate a tenant API key
      operationId: validateTenantKey
      tags: [Admin]
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: "{ valid: true, tenant: {...} } or { valid: false }"

  /tenants/{id}:
    get:
      summary: Get tenant by ID
      operationId: getTenant
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tenant data
        "404":
          description: Not found
    delete:
      summary: Deactivate a tenant
      operationId: deactivateTenant
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deactivated

  /tenants/{id}/tier:
    put:
      summary: Update tenant service tier
      operationId: updateTenantTier
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
