# clawtex-core Worker 配置模板
# Worker 只運行 Ollama 推理，不持有 API keys

[core]
host = "0.0.0.0"
port = 7878
# role = "worker"  # 未來支援
# hub_url = "http://10.0.1.1:7878"

[providers.ollama]
type = "ollama"
url = "http://localhost:11434"
default_model = "qwen2.5:7b"

# Worker 不需要 telegram, stripe, render, search 等配置
# 所有外部 API 呼叫由 Hub 代理

[agent.worker]
provider = "ollama"
model = "qwen2.5:7b"
tools = []
instructions = """
You are a worker node agent.
Process delegated tasks from the Hub and return results.
"""
