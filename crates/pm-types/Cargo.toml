[package]
name = "pm-types"
version = "0.6.0"
edition = "2021"
description = "Shared type definitions for Spectyn Mesh"
# Intentionally PERMISSIVE (not AGPL like core/ and app/): this is the shared
# wire-protocol "SDK" layer that satellite repos + third parties import. Keeping
# it MIT/Apache lets them depend on it without AGPL copyleft reaching their code
# — per the apex license split (AGPL core + Apache/MIT SDK + FSL relay).
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
fnv = "1"

[dev-dependencies]
dirs = "5"
